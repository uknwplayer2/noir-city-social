name: Noir Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.android.config.ts'
      - '.github/workflows/android-debug-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.android.config.ts'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore continuity debug keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.NOIR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Continuity keystore secret is not configured; using runner debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noir-continuity.keystore"
          echo "NOIR_KEYSTORE_PATH=$RUNNER_TEMP/noir-continuity.keystore" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Build debug APK
        run: npm run android:apk
        env:
          NOIR_KEYSTORE_PASSWORD: ${{ secrets.NOIR_KEYSTORE_PASSWORD }}
          NOIR_KEY_ALIAS: ${{ secrets.NOIR_KEY_ALIAS }}
          NOIR_KEY_PASSWORD: ${{ secrets.NOIR_KEY_PASSWORD }}
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: noir-city-debug-apk
          path: output/NOIR-*.apk
          if-no-files-found: error
          retention-days: 7
