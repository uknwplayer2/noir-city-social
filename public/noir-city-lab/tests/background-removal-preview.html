<body>

<a class="noir-lab-back" href="../index.html" aria-label="Voltar ao Noir City Lab">← Voltar ao Noir City Lab</a>
<h1>Noir City Lab</h1>
<p>Teste independente de remoção de fundo.</p>

<div class="controls">
  <label>
    <strong>1. Escolha a imagem Base Noir</strong>
    <input id="file" type="file" accept="image/png,image/webp,image/jpeg">
  </label>

  <label>
    <strong>2. Tolerância: <span id="toleranceValue">18</span></strong>
    <input id="tolerance" type="range" min="0" max="80" value="18">
  </label>

  <button id="process">Processar imagem</button>
  <button id="restore">Restaurar original</button>

  <p class="note">
    O fundo removido é identificado pela cor preta conectada
    às bordas. A imagem original não é modificada.
  </p>
</div>

<div class="grid">
  <section class="panel">
    <h2>Imagem original</h2>
    <div class="preview">
      <canvas id="original"></canvas>
    </div>
  </section>

  <section class="panel">
    <h2>Resultado com transparência</h2>
    <div class="preview">
      <canvas id="result"></canvas>
    </div>
  </section>
</div>

<section class="panel" style="margin-top:16px">
  <h2>Relatório</h2>
  <div id="stats" class="stats">Carregue uma imagem para começar.</div>
</section>

<script type="module">
import { BackgroundRemoval } from "../engine/BackgroundRemoval.js";

const fileInput = document.getElementById("file");
const toleranceInput = document.getElementById("tolerance");
const toleranceValue = document.getElementById("toleranceValue");
const originalCanvas = document.getElementById("original");
const resultCanvas = document.getElementById("result");
const stats = document.getElementById("stats");

const originalContext = originalCanvas.getContext("2d", {
  willReadFrequently: true
});

const resultContext = resultCanvas.getContext("2d");

let originalImageData = null;

function showStats(text) {
  stats.textContent = text;
}

function renderOriginal() {
  if (!originalImageData) return;

  originalCanvas.width = originalImageData.width;
  originalCanvas.height = originalImageData.height;

  originalContext.putImageData(originalImageData, 0, 0);
}

function renderResult(imageData) {
  resultCanvas.width = imageData.width;
  resultCanvas.height = imageData.height;

  resultContext.putImageData(imageData, 0, 0);
}

function processImage() {
  if (!originalImageData) {
    showStats("Escolha uma imagem primeiro.");
    return;
  }

  try {
    const result = BackgroundRemoval.remove(
      originalImageData,
      {
        color: "#000000",
        tolerance: Number(toleranceInput.value),
        eightConnected: false
      }
    );

    renderResult(result.imageData);

    const removedPercent = (
      result.stats.removedPixels /
      result.stats.totalPixels * 100
    ).toFixed(2);

    showStats(
      `Dimensões: ${result.stats.width} × ${result.stats.height}\n` +
      `Pixels totais: ${result.stats.totalPixels}\n` +
      `Pixels removidos: ${result.stats.removedPixels}\n` +
      `Pixels preservados: ${result.stats.remainingPixels}\n` +
      `Fundo removido: ${removedPercent}%\n` +
      `Tolerância: ${result.stats.tolerance}`
    );
  } catch (error) {
    showStats("Erro ao processar: " + error.message);
  }
}

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];

  if (!file) return;

  const image = new Image();
  const objectUrl = URL.createObjectURL(file);

  image.onload = () => {
    try {
      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;

      const context = canvas.getContext("2d", {
        willReadFrequently: true
      });

      context.drawImage(image, 0, 0);

      originalImageData = context.getImageData(
        0, 0, canvas.width, canvas.height
      );

      renderOriginal();
      processImage();

      showStats(
        `Imagem carregada: ${file.name}\n` +
        `Dimensões: ${image.naturalWidth} × ${image.naturalHeight}\n` +
        "Ajuste a tolerância e observe os contornos."
      );
    } catch (error) {
      showStats("Não foi possível ler a imagem: " + error.message);
    } finally {
      URL.revokeObjectURL(objectUrl);
    }
  };

  image.onerror = () => {
    URL.revokeObjectURL(objectUrl);
    showStats("Não foi possível abrir essa imagem.");
  };

  image.src = objectUrl;
});

toleranceInput.addEventListener("input", () => {
  toleranceValue.textContent = toleranceInput.value;
});

toleranceInput.addEventListener("change", processImage);

document.getElementById("process").addEventListener(
  "click", processImage
);

document.getElementById("restore").addEventListener("click", () => {
  if (!originalImageData) return;

  renderResult(originalImageData);

  showStats(
    "Imagem original restaurada na visualização. " +
    "Nenhum arquivo foi alterado."
  );
});
</script>
